name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  # ============================================================================
  # BUILD DEBUG APKs (both store + enthusiast flavors)
  # ============================================================================
  build-debug:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Product flavors (store + enthusiast) were added in v2.3.0-beta.
      # The bare 'assembleDebug' task no longer exists — build both flavors.
      - name: Build Store Debug APK
        run: |
          echo "::group::Building Store Debug APK (Huawei AppGallery)"
          ./gradlew assembleStoreDebug --stacktrace
          echo "::endgroup::"

      - name: Build Enthusiast Debug APK
        run: |
          echo "::group::Building Enthusiast Debug APK (Tier 2 Advanced Telemetry)"
          ./gradlew assembleEnthusiastDebug --stacktrace
          echo "::endgroup::"

      - name: Verify store APK has zero bydauto references
        run: |
          # Tier 2 architectural guarantee — see docs/ADVANCED_TELEMETRY.md §6.
          APK="app/build/outputs/apk/store/debug/app-store-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ Store APK not found at $APK"
            exit 1
          fi
          MATCHES=$(unzip -p "$APK" classes.dex | strings | grep -ci bydauto || true)
          echo "bydauto references in store APK: $MATCHES"
          if [ "$MATCHES" -ne 0 ]; then
            echo "❌ FAIL: store flavor contains bydauto references"
            exit 1
          fi
          echo "✅ PASS: store flavor has zero bydauto references"

      - name: Verify Debug APKs exist
        run: |
          for APK in \
            app/build/outputs/apk/store/debug/app-store-debug.apk \
            app/build/outputs/apk/enthusiast/debug/app-enthusiast-debug.apk; do
            if [ -f "$APK" ]; then
              echo "✅ Built: $APK ($(du -h "$APK" | cut -f1))"
            else
              echo "❌ Missing: $APK"
              exit 1
            fi
          done

      - name: Upload Store Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-debug-apk
          path: app/build/outputs/apk/store/debug/app-store-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Enthusiast Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enthusiast-debug-apk
          path: app/build/outputs/apk/enthusiast/debug/app-enthusiast-debug.apk
          retention-days: 14
          if-no-files-found: error

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (store flavor)
        run: ./gradlew testStoreDebugUnitTest --stacktrace --continue

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/**/*
          retention-days: 7

  # ============================================================================
  # BUILD RELEASE APKs (both flavors, only on release/tags)
  # ============================================================================
  build-release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Store Release APK
        run: |
          echo "::group::Building Store Release APK"
          ./gradlew assembleStoreRelease --stacktrace
          echo "::endgroup::"

      - name: Build Enthusiast Release APK
        run: |
          echo "::group::Building Enthusiast Release APK"
          ./gradlew assembleEnthusiastRelease --stacktrace
          echo "::endgroup::"

      - name: Verify store release APK has zero bydauto references
        run: |
          APK=$(find app/build/outputs/apk/store/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ Store release APK not found"
            exit 1
          fi
          MATCHES=$(unzip -p "$APK" classes.dex | strings | grep -ci bydauto || true)
          echo "bydauto references in store release APK: $MATCHES"
          if [ "$MATCHES" -ne 0 ]; then
            echo "❌ FAIL: store release flavor contains bydauto references"
            exit 1
          fi
          echo "✅ PASS: store release flavor has zero bydauto references"

      - name: Verify Release APKs exist
        run: |
          for APK in \
            $(find app/build/outputs/apk/store/release -name "*.apk" | head -1) \
            $(find app/build/outputs/apk/enthusiast/release -name "*.apk" | head -1); do
            if [ -f "$APK" ]; then
              echo "✅ Built: $APK ($(du -h "$APK" | cut -f1))"
            else
              echo "❌ Missing: $APK"
              exit 1
            fi
          done

      - name: Upload Store Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-release-apk
          path: app/build/outputs/apk/store/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Enthusiast Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: enthusiast-release-apk
          path: app/build/outputs/apk/enthusiast/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/store/release/*.apk
            app/build/outputs/apk/enthusiast/release/*.apk
          generate_release_notes: true

  # ============================================================================
  # MODEL MANIFEST (only on release)
  # ============================================================================
  model-manifest:
    name: Create Model Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [build-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Store Release APK
        uses: actions/download-artifact@v4
        with:
          name: store-release-apk
          path: ./artifacts

      - name: Generate Model Manifest
        run: |
          echo "::group::Generating Model Manifest"

          # Get release version
          RELEASE_VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_VERSION" ]; then
            RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          RELEASE_NAME="${{ github.event.release.name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="Binti $RELEASE_VERSION"
          fi

          cat > model_manifest.json << EOF
          {
            "manifest_version": "1.0.0",
            "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "release": {
              "version": "${RELEASE_VERSION}",
              "name": "${RELEASE_NAME}",
              "tag": "${RELEASE_VERSION}",
              "github_url": "${{ github.event.release.html_url }}"
            },
            "app_info": {
              "package_name": "com.binti.dilink",
              "min_sdk": 26,
              "target_sdk": 34,
              "version_code": 7,
              "version_name": "2.3.1-beta",
              "flavors": {
                "store": {
                  "application_id": "com.binti.dilink",
                  "description": "Huawei AppGallery build — Tier 1 only (Accessibility-based vehicle data)",
                  "tier_2_available": false
                },
                "enthusiast": {
                  "application_id": "com.binti.dilink.enthusiast",
                  "description": "GitHub Releases sideload build — Tier 1 + Tier 2 (Advanced Telemetry, opt-in)",
                  "tier_2_available": true
                }
              }
            },
            "models": [
              {
                "id": "asr_arabic",
                "name": "ASR (Vosk MGB2 v0.4)",
                "description": "Modern Standard Arabic speech recognition model",
                "file": "vosk-model-ar-mgb2-0.4.zip",
                "size_mb": 1247,
                "required": true,
                "download": {
                  "provider": "Google Drive",
                  "google_drive_id": "1bK1-pUCH5xykvKdB7nB7mZ_1wBKH05qZ",
                  "url": "https://drive.google.com/uc?export=download&id=1bK1-pUCH5xykvKdB7nB7mZ_1wBKH05qZ"
                },
                "installation": {
                  "extract": true,
                  "relative_path": "models"
                },
                "notes": "Large model - WiFi recommended for download"
              },
              {
                "id": "wake_word",
                "name": "Wake Word Detection",
                "description": "Detects 'يا بنتي' (Ya Binti) wake phrase",
                "size_mb": 0,
                "required": false,
                "method": "vosk_grammar",
                "wake_phrase": "يا بنتي",
                "grammar": "[\"يا بنتي\", \"[unk]\"]",
                "notes": "Uses Vosk grammar-based detection from ASR model - no separate download needed"
              },
              {
                "id": "nlu_classifier",
                "name": "NLU Intent Classifier",
                "description": "Egyptian Arabic intent classification model",
                "file": "egybert_tiny_int8.onnx",
                "size_mb": 25,
                "required": false,
                "fallback": "Rule-based intent matching",
                "notes": "Optional - fallback to rule-based matching if unavailable"
              },
              {
                "id": "tts_voice",
                "name": "TTS Voice",
                "description": "Egyptian Arabic text-to-speech voice",
                "file": "ar-eg-female.zip",
                "size_mb": 80,
                "required": false,
                "fallback": "Android TTS / Huawei ML Kit TTS",
                "notes": "Optional - fallback to system TTS if unavailable"
              }
            ],
            "model_summary": {
              "total_required_size_mb": 1247,
              "total_optional_size_mb": 105,
              "hosting": "Google Drive",
              "download_recommendations": {
                "wifi_recommended": true,
                "size_warning_threshold_mb": 500
              }
            },
            "required_models": {
              "asr_arabic": {
                "purpose": "Speech recognition - core functionality",
                "size": "1247 MB",
                "must_download": true
              }
            },
            "optional_models": {
              "wake_word": {
                "purpose": "Wake word detection",
                "method": "Uses Vosk grammar (no download)"
              },
              "nlu_classifier": {
                "purpose": "Enhanced intent classification",
                "fallback": "Rule-based matching"
              },
              "tts_voice": {
                "purpose": "Egyptian Arabic voice synthesis",
                "fallback": "System TTS engines"
              }
            }
          }
          EOF

          echo "::endgroup::"
          echo ""
          echo "📄 Model manifest generated successfully"

      - name: Upload Model Manifest
        uses: actions/upload-artifact@v4
        with:
          name: model-manifest
          path: model_manifest.json
          retention-days: 90

      - name: Add Model Manifest to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: model_manifest.json

      - name: Display Summary
        run: |
          echo "## 📦 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Models Required" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Size | Required | Hosted On |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|----------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| ASR (Vosk MGB2 v0.4) | 1247 MB | ✅ Yes | Google Drive |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Models Optional" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Size | Fallback |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Wake Word | N/A | Vosk Grammar |" >> $GITHUB_STEP_SUMMARY
          echo "| NLU Classifier | 25 MB | Rule-based |" >> $GITHUB_STEP_SUMMARY
          echo "| TTS Voice | 80 MB | System TTS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Required Download:** 1247 MB" >> $GITHUB_STEP_SUMMARY
