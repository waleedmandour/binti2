name: Build Binti APK

on:
  # Run on every push to main or develop
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  # Run on every pull request targeting main
  pull_request:
    branches: [ main ]
  # Allow manual trigger from GitHub Actions UI with options
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      upload_artifact:
        description: 'Upload APK as artifact'
        required: false
        default: true
        type: boolean

# Cancel any in-progress run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Java version required by the project (Kotlin 2.0 needs JDK 17+)
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  # Gradle cache key prefix
  GRADLE_CACHE_KEY: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & unit tests (fast feedback, runs in parallel with build)
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for version calculation

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: gradle-

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Run unit tests on the store flavor (Tier 1 only — Tier 2 code is
      # compiled out of this flavor, which is exactly what we want to verify
      # at CI time).
      - name: Run unit tests (store flavor)
        run: ./gradlew testStoreDebugUnitTest --continue --no-daemon --stacktrace

      - name: Run Android Lint (store flavor)
        run: ./gradlew lintStoreDebug --continue --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/**/*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build Debug APKs (both flavors)
  # ─────────────────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip if manual trigger asked for release only
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.build_type == 'debug' ||
      inputs.build_type == 'both'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: gradle-

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # Compute a version name from git: v<tag>-<distance>-g<sha>-debug
      - name: Compute version name
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version_name=${VERSION}-debug" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}-debug"

      # Build BOTH flavors. Product flavors (store + enthusiast) were added
      # in v2.3.0-beta; the bare 'assembleDebug' task no longer exists.
      - name: Build Store Debug APK (Huawei AppGallery)
        run: |
          ./gradlew assembleStoreDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.version.name=${{ steps.version.outputs.version_name }}

      - name: Build Enthusiast Debug APK (Tier 2 Advanced Telemetry)
        run: |
          ./gradlew assembleEnthusiastDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.version.name=${{ steps.version.outputs.version_name }}

      - name: Verify store APK has zero bydauto references
        run: |
          # Tier 2 architectural guarantee: the store flavor must not contain
          # any android.hardware.bydauto.* references. This grep is the CI
          # enforcement of the contract documented in docs/ADVANCED_TELEMETRY.md §6.
          APK=app/build/outputs/apk/store/debug/app-store-debug.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: store APK not found at $APK"
            exit 1
          fi
          MATCHES=$(unzip -p "$APK" classes.dex | strings | grep -ci bydauto || true)
          echo "bydauto references in store APK: $MATCHES"
          if [ "$MATCHES" -ne 0 ]; then
            echo "❌ FAIL: store flavor contains bydauto references — Tier 2 isolation broken"
            exit 1
          fi
          echo "✅ PASS: store flavor has zero bydauto references"

      - name: Rename APKs with version
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/store/debug/app-store-debug.apk \
             artifacts/binti-${{ steps.version.outputs.version_name }}-store.apk
          cp app/build/outputs/apk/enthusiast/debug/app-enthusiast-debug.apk \
             artifacts/binti-${{ steps.version.outputs.version_name }}-enthusiast.apk
          ls -la artifacts/

      - name: Upload Store Debug APK artifact
        if: |
          github.event_name != 'workflow_dispatch' ||
          inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: binti-store-debug-${{ steps.version.outputs.version_name }}
          path: artifacts/binti-${{ steps.version.outputs.version_name }}-store.apk
          retention-days: 30

      - name: Upload Enthusiast Debug APK artifact
        if: |
          github.event_name != 'workflow_dispatch' ||
          inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: binti-enthusiast-debug-${{ steps.version.outputs.version_name }}
          path: artifacts/binti-${{ steps.version.outputs.version_name }}-enthusiast.apk
          retention-days: 30

      # Post APK download link as a PR comment for convenience
      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ✅ Debug APKs built successfully\n**Version:** \`${{ steps.version.outputs.version_name }}\`\n\n- 🏪 **Store flavor** (Huawei AppGallery, Tier 1 only): download from Actions artifacts\n- 🧪 **Enthusiast flavor** (Tier 2 Advanced Telemetry): download from Actions artifacts\n\n📦 [Download from Actions artifacts](${runUrl})`
            });

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Build Release APKs (signed) — both flavors
  # ─────────────────────────────────────────────────────────────────────────
  build-release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only run on main branch pushes, tags, or explicit manual trigger
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: gradle-

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Compute version name
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version_name=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      # Decode the base64-encoded keystore stored as a GitHub Secret
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  KEYSTORE_BASE64 secret not set — building unsigned release APKs"
            echo "signed=false" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/keystore.jks
            echo "signed=true" >> $GITHUB_ENV
          fi

      # Build BOTH flavors. Product flavors (store + enthusiast) were added
      # in v2.3.0-beta; the bare 'assembleRelease' task no longer exists.
      - name: Build Store Release APK (signed)
        if: env.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleStoreRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            -Pandroid.injected.version.name=${{ steps.version.outputs.version_name }}

      - name: Build Enthusiast Release APK (signed)
        if: env.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleEnthusiastRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            -Pandroid.injected.version.name=${{ steps.version.outputs.version_name }}

      - name: Build Release APKs (unsigned fallback)
        if: env.signed == 'false'
        run: |
          ./gradlew assembleStoreRelease assembleEnthusiastRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.version.name=${{ steps.version.outputs.version_name }}

      - name: Verify store release APK has zero bydauto references
        run: |
          APK=$(find app/build/outputs/apk/store/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: store release APK not found"
            exit 1
          fi
          MATCHES=$(unzip -p "$APK" classes.dex | strings | grep -ci bydauto || true)
          echo "bydauto references in store release APK: $MATCHES"
          if [ "$MATCHES" -ne 0 ]; then
            echo "❌ FAIL: store release flavor contains bydauto references"
            exit 1
          fi
          echo "✅ PASS: store release flavor has zero bydauto references"

      - name: Rename APKs with version
        run: |
          mkdir -p artifacts
          SUFFIX=$([ "${{ env.signed }}" = "true" ] && echo "release-signed" || echo "release-unsigned")
          cp $(find app/build/outputs/apk/store/release -name "*.apk" | head -1) \
             "artifacts/binti-${{ steps.version.outputs.version_name }}-store-${SUFFIX}.apk"
          cp $(find app/build/outputs/apk/enthusiast/release -name "*.apk" | head -1) \
             "artifacts/binti-${{ steps.version.outputs.version_name }}-enthusiast-${SUFFIX}.apk"
          ls -la artifacts/

      - name: Upload Store Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: binti-store-release-${{ steps.version.outputs.version_name }}
          path: artifacts/binti-${{ steps.version.outputs.version_name }}-store-release-*.apk
          retention-days: 90

      - name: Upload Enthusiast Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: binti-enthusiast-release-${{ steps.version.outputs.version_name }}
          path: artifacts/binti-${{ steps.version.outputs.version_name }}-enthusiast-release-*.apk
          retention-days: 90

      # Automatically attach APKs to a GitHub Release when a tag is pushed
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/binti-${{ steps.version.outputs.version_name }}-store-release-*.apk
            artifacts/binti-${{ steps.version.outputs.version_name }}-enthusiast-release-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Summary — posts a final status comment showing all artifact links
  # ─────────────────────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ lint, build-debug ]
    if: always()

    steps:
      - name: Write job summary
        run: |
          echo "## 🚗 Binti Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Unit Tests | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APKs (store + enthusiast) | ${{ needs.build-debug.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download artifacts from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY
          echo "🔌 Install with: \`adb install -r binti-*.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flavors" >> $GITHUB_STEP_SUMMARY
          echo "- 🏪 **store** — Huawei AppGallery build. Tier 1 only (Accessibility-based vehicle data). Zero \`bydauto\` references." >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 **enthusiast** — GitHub Releases sideload build. Tier 1 + Tier 2 (Advanced Telemetry, opt-in)." >> $GITHUB_STEP_SUMMARY
