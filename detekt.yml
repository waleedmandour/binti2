# ──────────────────────────────────────────────────────────────────────────────
# Binti — Detekt configuration
#
# Build upon detekt's default config, overriding only project-specific rules.
# Run: ./gradlew detekt
#
# Phase 0 note: `ignoreFailures = true` is set in app/build.gradle.kts so detekt
# runs but does NOT fail the build. This lets us introduce detekt without
# blocking the existing codebase. Phase 4 will set it to `false` once the
# backlog is cleared.
# ──────────────────────────────────────────────────────────────────────────────

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120
    # Phase 0: existing god classes (DiLinkCommandExecutor, DiLinkAccessibilityService)
    # exceed this. They are refactored in Phase 2. Suppress with @Suppress("LongMethod")
    # or raise threshold temporarily. Keeping it at 120 as the target.
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 8
  ComplexCondition:
    active: true
    threshold: 6
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  TooLongFunction:
    active: true
    threshold: 120
  LargeClass:
    active: true
    threshold: 600
  ComplexInterface:
    active: true

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  MagicNumber:
    active: false
    # Disabled: BYD vehicle field IDs, intent codes, and resource IDs are
    # inherently "magic numbers" that are documented inline. Enforcing
    # named constants for every one would harm readability.
  WildcardImport:
    active: false
    # Disabled: the existing codebase uses wildcard imports for AndroidX.
    # Enabling this would generate hundreds of warnings on existing code.
  ReturnCount:
    active: true
    max: 4
  ForbiddenComment:
    active: true
    values: ['STOPSHIP', 'TODO:')
    # TODO: is flagged so we track unfinished work. Use @Suppress("ForbiddenComment")
    # for intentional TODOs with a linked issue.
  ForbiddenImport:
    active: true
    imports:
      - value: 'org.tensorflow.*'
        reason: 'TensorFlow Lite was removed in v2.6.0-beta. Use rule-based classification instead.'
      - value: 'com.microsoft.onnxruntime.*'
        reason: 'ONNX Runtime was removed in v2.6.0-beta.'
      - value: 'okhttp3.*'
        reason: 'OkHttp was removed (unused). Use HttpURLConnection or DownloadManager instead.'
  SerialVersionUIDInSerializableClass:
    active: false
    # Disabled: the project uses SharedPreferences + JSON, not Java serialization.

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

exceptions:
  active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'NumberFormatException'
      - 'IllegalArgumentException'

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|(`.*`)'
    excludeClassPattern: '$^'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunctionOnCoroutineScope:
    active: true

formatting:
  active: true
  # Use detekt-formatting plugin (added in app/build.gradle.kts dependencies)
  autoCorrect = false
  # Phase 0: don't auto-correct on detekt run. Developers run
  # `./gradlew detektFormat` explicitly to apply formatting fixes.
  MaximumLineLength:
    active: true
    maxLineLength = 140
  Indentation:
    active: true
    indentSize = 4
  NoWildcardImports:
    active: false
  ImportOrdering:
    active: false
  TrailingWhitespace:
    active: true
  NoEmptyFirstLineInMethodBlock:
    active: true
